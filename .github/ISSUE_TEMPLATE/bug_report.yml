name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并确认你用的是最新版本。
        **不要粘贴 API Key、密码、个人作文/题目或任何隐私数据。**
  - type: input
    id: version
    attributes:
      label: 版本
      description: App 版本 / commit / Release 标签
      placeholder: 例如 1.0.0 或 v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android APK
        - 浏览器 / PWA
        - Windows 桌面
        - iOS / iPad（PWA）
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 请先删除其中的 Key、个人信息和版权内容
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我已移除 API Key、密码、个人数据和受版权保护的原文
          required: true
