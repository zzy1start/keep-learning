name: Mirror to Gitee

on:
  # 先只保留手动触发：Gitee 仓库/部署公钥配好之前，push 时不会每天挂一个红叉。
  workflow_dispatch:
  # 配好 GITEE_SSH_PRIVATE_KEY 后，取消下面注释即可在 push/tag 时自动镜像：
  # push:
  #   branches: [main]
  #   tags: ["v*"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Push mirror
        env:
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          REPO="${GITEE_REPO:-git@gitee.com:ZZY1START/keep-learning.git}"
          git remote add gitee "$REPO" 2>/dev/null || git remote set-url gitee "$REPO"
          git push --mirror gitee
