name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check data integrity
        run: node tools/check-data-integrity.cjs

      - name: Check audio pack (skips when lite)
        run: node tools/check-audio-pack.cjs

      - name: Check import pipeline
        run: node tools/check-import-pipeline.cjs

      - name: Check vocab engine
        run: node tools/check-vocab-engine.cjs

      - name: Check feedback entry
        run: node tools/check-feedback-mail.cjs

      - name: Check listening fixes
        run: node tools/check-listening-fixes.cjs

      - name: Check vocab view
        run: node tools/check-vocab-view.cjs

      - name: Check listening paper (skips real fixtures when absent)
        run: node tools/check-listening-paper.cjs

      - name: Build lite web assets
        run: node tools/build-android.cjs --no-audio

      - name: Upload dist-lite
        uses: actions/upload-artifact@v4
        with:
          name: dist-lite
          path: dist-android
