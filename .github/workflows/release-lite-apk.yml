name: Release lite APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build lite web assets
        run: node tools/build-android.cjs --no-audio

      - name: Rebuild Android project
        run: node tools/init-android.cjs

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk keep-learning-lite-CI-debug.apk
          sha256sum keep-learning-lite-CI-debug.apk > keep-learning-lite-CI-debug.apk.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keep-learning-lite-CI-debug.apk
            keep-learning-lite-CI-debug.apk.sha256
          generate_release_notes: true

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: keep-learning-lite-CI-debug-apk
          path: |
            keep-learning-lite-CI-debug.apk
            keep-learning-lite-CI-debug.apk.sha256
