<!DOCTYPE html>
<html lang="zh-CN">

<title>Keep Learning · 英语学习工作台</title>
<meta name="description" content="本地英语学习工作台：单词、听力、阅读、写作、翻译与树园养成">

<!-- ======== 侧边导航 ======== -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo" id="sbLogo" title="Keep Learning"><img src="assets/logo.png" alt="Keep Learning"></div>
    <button class="sb-collapse" id="btnCollapse" title="收起/展开">«</button>
  </div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot" id="sbFoot">
    <button class="sb-item" data-nav="notebook">
      <svg viewBox="0 0 24 24" class="ic"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      <span>生词本</span></button>
    <button class="sb-item" data-nav="stats">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>统计</span></button>
    <button class="sb-item" data-nav="settings">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span>设置</span></button>
  </div>
</aside>

<!-- ======== 主区域 ======== -->
<main class="main" id="main">
  <div class="bg-deco" id="bgDeco"></div>
